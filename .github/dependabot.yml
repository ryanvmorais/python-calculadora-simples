# Dependabot — consumido pelo GitHub, sem CI próprio. Abre PRs de
# atualizacao de rotina; separado das security updates (Dependabot alerts).
# Agenda: domingo, 09:00 (America/Sao_Paulo). Cada ecossistema abre um único PR
# agrupado com os bumps minor e patch; um major continua em PR próprio. As
# security updates seguem o ritmo dos alertas e ignoram esta agenda.
version: 2
updates:
  # Dependencias de desenvolvimento (ruff, black, mypy, pytest) via uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions usadas no workflow de CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
