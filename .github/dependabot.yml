# Dependabot — consumido pelo GitHub, sem CI próprio. Abre PRs de
# atualizacao de rotina; separado das security updates (Dependabot alerts).
version: 2
updates:
  # Dependencias de desenvolvimento (ruff, black, mypy, pytest) via uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"

  # Actions usadas no workflow de CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
